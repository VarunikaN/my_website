services:
  postgres:
    image: postgres:16-alpine
    container_name: retail-ops-postgres
    environment:
      POSTGRES_DB: retail_ops
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    volumes:
      - retail_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retail_pg_data:
